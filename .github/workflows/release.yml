name: Release

# On every merged PR, release each labelled PR merged since the latest tag, oldest first: tag its merge commit, publish
# the package built from that commit to GitHub Packages, and create a GitHub Release with the package attached. A run
# cancelled while waiting in the queue loses nothing, because the next run releases its PR too. Nothing is committed:
# the version is written into package.json only inside this job's checkout, for the artefact.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/plan-releases.mjs > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "count=$(jq length "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-pnpm
        if: steps.plan.outputs.count != '0'

      - name: Test, pack, tag and publish each release, oldest first
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          jq -c '.[]' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/releases"
          while read -r release <&3; do
            sha=$(jq -r .sha <<< "$release")
            version=$(jq -r .version <<< "$release")
            pack="$RUNNER_TEMP/pack/$version"
            git checkout --quiet --force --detach "$sha"
            git clean -fdxq -e node_modules
            pnpm install --frozen-lockfile
            pnpm test
            pnpm build:types
            npm pkg set version="${version#v}"
            pnpm pack --pack-destination "$pack"
            git checkout --quiet -- package.json
            git tag -a "$version" -m "$version" "$sha"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$version"
            npm publish "$pack"/*.tgz --userconfig "$RUNNER_TEMP/.npmrc"
            gh release create "$version" --repo "$GITHUB_REPOSITORY" --title "$version" --generate-notes "$pack"/*.tgz \
              || echo "::warning::$version is tagged and published, but its GitHub Release wasn't created."
          done 3< "$RUNNER_TEMP/releases"
